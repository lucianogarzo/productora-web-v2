<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects</title>
    <link rel="stylesheet" href="/css/style.css" />

    <meta name="description" content="Portfolio de proyectos audiovisuales." />
<link rel="icon" href="/assets/favicon.png" />
<meta property="og:image" content="https://productora-web-v2.pages.dev/assets/og.jpg" />
<meta property="og:url" content="https://www.bycalabria.com/projects/" />
<link rel="canonical" href="https://www.bycalabria.com/projects/" />


    <style>
      /* small page-specific tweaks */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 18px;
        padding-top: 28px;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        max-width: 80ch;
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .pill {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        padding: 8px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        opacity: 0.9;
      }
      .pill:hover { opacity: 1; }
      .pill.active {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.22);
      }

      /* detail view */
      .detail-wrap {
        padding: 26px 0 54px;
      }

      .backline {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 10px 0 18px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--fg);
        opacity: 0.9;
      }

      .detail-title {
        font-size: 36px;
        margin: 8px 0 10px;
        line-height: 1.05;
      }

      .detail-sub {
        margin: 0 0 18px;
        color: var(--muted);
      }

      .detail-video {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: #111;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .detail-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .detail-desc {
        margin-top: 18px;
        color: var(--muted);
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .hidden { display: none; }
    </style>
  </head>

  <body>
   <script type="module">
  import { mountNav } from "../js/nav.js";
  mountNav();
</script>


    <main class="container">
      <!-- LIST VIEW -->
      <section id="listView" class="section" style="padding-top: 36px">
        <div class="top">
          <div>
           <h1 class="h1 display" id="pageTitle">Projects</h1>
            <p class="subtitle" id="pageSubtitle">
              Selección de trabajos. Dirección, producción y post.
            </p>
          </div>

          <div class="filters" id="filters"></div>
        </div>

        <div style="height: 18px"></div>

        <div class="grid" id="grid"></div>
      </section>

      <!-- DETAIL VIEW -->
      <section id="detailView" class="hidden detail-wrap">
        <div class="backline">
          <a class="back" href="/projects/" id="backBtn">← Projects</a>
          <span style="color: var(--muted2); font-size: 13px" id="detailSlug"></span>
        </div>

        <h1 class="detail-title display" id="detailTitle">
        <p class="detail-sub" id="detailSub"></p>

        <div class="detail-video" id="detailVideo"></div>

        <div class="detail-desc" id="detailDesc"></div>
      </section>
    </main>

    <script type="module">
      import { getLang } from "../js/site.js";
import { fetchProjects, fetchProjectBySlug } from "../js/sanity.js";


      // --- language copy
      const lang = getLang();

      const COPY = {
        es: {
          title: "Projects",
          subtitle: "Selección de trabajos. Dirección, producción y post.",
          back: "← Projects",
          notFoundTitle: "Project not found",
          notFoundDesc: (slug) => `No se encontró el proyecto con slug: ${slug}`,
          invalidVideo: "Video URL inválida (YouTube/Vimeo).",
          filters: ["All", "Featured"],
        },
        en: {
          title: "Projects",
          subtitle: "Selected work. Direction, production and post.",
          back: "← Projects",
          notFoundTitle: "Project not found",
          notFoundDesc: (slug) => `No project found for slug: ${slug}`,
          invalidVideo: "Invalid video URL (YouTube/Vimeo).",
          filters: ["All", "Featured"],
        },
      };

      const c = COPY[lang];

      // --- dom
      const listView = document.getElementById("listView");
      const detailView = document.getElementById("detailView");

      const grid = document.getElementById("grid");
      const filters = document.getElementById("filters");

      const pageTitle = document.getElementById("pageTitle");
      const pageSubtitle = document.getElementById("pageSubtitle");

      const backBtn = document.getElementById("backBtn");
      const detailSlug = document.getElementById("detailSlug");
      const detailTitle = document.getElementById("detailTitle");
      const detailSub = document.getElementById("detailSub");
      const detailVideo = document.getElementById("detailVideo");
      const detailDesc = document.getElementById("detailDesc");

      pageTitle.textContent = c.title;
      pageSubtitle.textContent = c.subtitle;
      backBtn.textContent = c.back;

      // --- state
      let projects = [];
      let filterMode = "all"; // all | featured

      function titleFor(p) {
        return lang === "es" ? p.title_es : p.title_en;
      }

      function descFor(p) {
        return lang === "es" ? p.description_es : p.description_en;
      }

      // --- video helpers (YouTube + Vimeo)
      function vimeoId(url) {
        if (!url) return null;
        const m = String(url).match(/\b(\d{6,12})\b/);
        return m ? m[1] : null;
      }

      function youtubeId(url) {
        if (!url) return null;
        try {
          const u = new URL(url);

          if (u.hostname.includes("youtu.be")) {
            return u.pathname.replace("/", "");
          }

          if (u.searchParams.get("v")) {
            return u.searchParams.get("v");
          }

          const parts = u.pathname.split("/");
          return parts.pop() || null;
        } catch (e) {
          return null;
        }
      }

      function videoEmbedHTML(url) {
        const yt = youtubeId(url);
        if (yt) {
          return `<iframe
            src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=0&mute=0&controls=1&modestbranding=1&rel=0"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
          ></iframe>`;
        }

        const vm = vimeoId(url);
        if (vm) {
          return `<iframe
            src="https://player.vimeo.com/video/${vm}?autoplay=0&muted=0&title=0&byline=0&portrait=0"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen
          ></iframe>`;
        }

        return null;
      }

      // --- render list
      function renderFilters() {
        filters.innerHTML = `
          <button class="pill ${filterMode === "all" ? "active" : ""}" data-mode="all">${c.filters[0]}</button>
          <button class="pill ${filterMode === "featured" ? "active" : ""}" data-mode="featured">${c.filters[1]}</button>
        `;

        filters.querySelectorAll(".pill").forEach((btn) => {
          btn.addEventListener("click", () => {
            filterMode = btn.getAttribute("data-mode");
            renderList();
            renderFilters();
          });
        });
      }

      function renderList() {
        const list = filterMode === "featured"
          ? projects.filter((p) => p.featured)
          : projects;

       featuredGrid.innerHTML = featured.map(p => `
  <a class="card" href="/projects/#/${encodeURIComponent(p.slug)}">
    <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy"/>
    <div class="meta">
      <h3 class="display">${titleFor(p)}</h3>
      <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
    </div>
  </a>
`).join("");


              <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
            </div>
          </a>
        `).join("");
      }

      // --- render detail
      async function renderDetail(slug) {
        detailSlug.textContent = slug ? `/${slug}` : "";
        const project = await fetchProjectBySlug(slug);

        if (!project) {
          detailTitle.textContent = c.notFoundTitle;
          detailSub.textContent = "";
          detailVideo.innerHTML = "";
          detailDesc.textContent = c.notFoundDesc(slug);
          document.title = `${c.notFoundTitle} – ${c.title}`;
          return;
        }

        const t = titleFor(project);
        detailTitle.textContent = t;
        detailSub.textContent = [project.client, project.year].filter(Boolean).join(" • ");
        detailDesc.textContent = descFor(project) || "";

        document.title = `${t} – ${c.title}`;

        const embed = videoEmbedHTML(project.vimeo_url);
        detailVideo.innerHTML = embed
          ? embed
          : `<div style="padding:24px;opacity:.7">${c.invalidVideo}</div>`;
      }

      function showList() {
        detailView.classList.add("hidden");
        listView.classList.remove("hidden");
        document.title = c.title;
      }

      function showDetail() {
        listView.classList.add("hidden");
        detailView.classList.remove("hidden");
      }

      // --- router
      function route() {
        const hash = location.hash || "";
        const m = hash.match(/^#\/(.+)$/);

        if (!m) {
          showList();
          renderList();
          return;
        }

        const slug = decodeURIComponent(m[1]);
        showDetail();
        renderDetail(slug);
      }

      window.addEventListener("hashchange", route);

      // --- init
      (async () => {
        renderFilters();
        projects = await fetchProjects();
        renderList();
        route();
      })();
    </script>
  </body>
</html>
