<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects</title>

    <!-- Main styles -->
    <link rel="stylesheet" href="/css/style.css" />

    <!-- SEO / OG -->
    <meta name="description" content="Portfolio de proyectos audiovisuales." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Calabria – Projects" />
    <meta property="og:description" content="Selección de trabajos audiovisuales." />
    <meta property="og:image" content="https://productora-web-v2.pages.dev/assets/og.jpg" />
    <meta property="og:url" content="https://productora-web-v2.pages.dev/projects/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.png" />
    <link rel="canonical" href="https://www.bycalabria.com/projects/" />

    <style>
      /* page-specific */
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 18px;
        padding-top: 28px;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        max-width: 80ch;
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .pill {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.05);
        color: var(--fg);
        padding: 8px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
        opacity: 0.9;
      }
      .pill:hover {
        opacity: 1;
      }
      .pill.active {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.22);
      }

      /* detail view */
      .detail-wrap {
        padding: 26px 0 54px;
      }

      .backline {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 10px 0 18px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--fg);
        opacity: 0.9;
      }

      .detail-title {
        font-size: 36px;
        margin: 8px 0 10px;
        line-height: 1.05;
      }

      .detail-sub {
        margin: 0 0 18px;
        color: var(--muted);
      }

      .detail-video {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: #111;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--line);
      }

      .detail-video iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .detail-desc {
        margin-top: 18px;
        color: var(--muted);
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .hidden {
        display: none;
        
      .video-loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color: rgba(255,255,255,.65);
  font-size:12px;
  letter-spacing:.18em;
  text-transform: uppercase;
  background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.06), rgba(0,0,0,.65));
}

.fade-in{
  animation: fadeIn .45s ease both;
}
@keyframes fadeIn{
  from{ opacity:0; transform: translateY(6px); filter: blur(6px); }
  to{ opacity:1; transform: translateY(0); filter: blur(0); }
}
.gallery{
  margin-top: 16px;
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

@media (max-width: 900px){
  .gallery{ grid-template-columns: repeat(2, 1fr); }
}

.gallery img{
  width:100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  border-radius: 14px;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: transform .25s ease, opacity .25s ease;
  opacity: .95;
}
.gallery img:hover{
  transform: scale(1.01);
  opacity: 1;
}
        /* Lightbox */
.lightbox{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 18px;
  z-index: 99999;
}

.lightbox.hidden{
  display:none;
}

.lightbox-img{
  max-width: min(1100px, 96vw);
  max-height: 86vh;
  border-radius: 16px;
  border: 1px solid rgba(255,255,255,.14);
  object-fit: contain;
}

.lightbox-close{
  position:absolute;
  top: 16px;
  right: 16px;
  width: 42px;
  height: 42px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,.18);
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.92);
  cursor:pointer;
  font-size: 16px;
}
.lightbox-close:hover{
  background: rgba(255,255,255,.14);
}


      }
    </style>
  </head>

  <body>
    <!-- NAV mount -->
    <script type="module">
      import { mountNav } from "/js/nav.js";
      mountNav();
    </script>

    <main class="container">
      <!-- LIST VIEW -->
      <section id="listView" class="section" style="padding-top: 36px">
        <div class="top">
          <div>
            <h1 class="h1 display" id="pageTitle">Nuestro trabajo</h1>
            <p class="subtitle" id="pageSubtitle">
              Pensamos, producimos y entregamos.
            </p>
          </div>

          <div class="filters" id="filters"></div>
        </div>

        <div style="height: 18px"></div>

        <div class="grid" id="grid"></div>
      </section>

      <!-- DETAIL VIEW -->
      <section id="detailView" class="hidden detail-wrap">
        <div class="backline">
          <a class="back" href="/projects/" id="backBtn">← Projects</a>
          <span style="color: var(--muted2); font-size: 13px" id="detailSlug"></span>
        </div>

        <h1 class="detail-title display" id="detailTitle"></h1>
        <p class="detail-sub" id="detailSub"></p>

        <div class="detail-video" id="detailVideo">
        <!-- GALLERY -->
<div class="gallery" id="gallery"></div>

        <div class="detail-desc" id="detailDesc"></div>
      </section>
    </main>
    
<!-- LIGHTBOX -->
<div class="lightbox hidden" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">✕</button>
  <button class="lightbox-arrow left" id="lightboxPrev" aria-label="Previous">‹</button>
  <button class="lightbox-arrow right" id="lightboxNext" aria-label="Next">›</button>
  <div class="lightbox-count" id="lightboxCount">1 / 1</div>
  <img class="lightbox-img" id="lightboxImg" alt="" />
</div>


    <!-- ✅ main logic (external JS) -->
    <script type="module" src="/projects/projects.js"></script>
  </body>
</html>
