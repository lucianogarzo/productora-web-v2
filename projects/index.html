<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects</title>

    <style>
      body { margin: 0; font-family: system-ui, -apple-system, Arial; background: #000; color: #fff; }
      header { padding: 24px; display:flex; justify-content:space-between; align-items:center; }
      a { color: #fff; text-decoration: none; opacity:.9; }
      a:hover { opacity: 1; }
      .lang { border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#fff; padding:8px 10px; border-radius:10px; cursor:pointer; }

      .grid { display:grid; gap:14px; padding: 24px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      .card { position:relative; border-radius:14px; overflow:hidden; background:#111; cursor:pointer; }
      .card img { width:100%; height: 260px; object-fit:cover; display:block; opacity:.9; }
      .meta { position:absolute; left:0; right:0; bottom:0; padding:14px; background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0)); }
      .meta h3 { margin:0; font-size: 16px; }
      .meta p { margin:6px 0 0; opacity:.75; font-size: 13px; }

      .wrap { padding: 0 24px 40px; max-width: 1100px; margin: 0 auto; }
      .title { font-size: 34px; margin: 8px 0 10px; }
      .sub { opacity:.75; margin: 0 0 20px; }

      .video { position: relative; width: 100%; padding-top: 56.25%; background:#111; border-radius:16px; overflow:hidden; }
      .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

      .desc { margin-top: 22px; opacity:.9; line-height:1.5; white-space: pre-wrap; }

      /* View toggles */
      .hidden { display:none; }
      .back { display:inline-flex; align-items:center; gap:8px; }
    </style>
  </head>

  <body>
    <header>
      <a href="/" class="back">← Home</a>
      <button class="lang" id="langBtn">ES</button>
    </header>

    <!-- LIST -->
    <main id="listView" class="grid"></main>

    <!-- DETAIL -->
    <main id="detailView" class="hidden">
      <div class="wrap">
        <a href="/projects/" class="back" id="backBtn">← Projects</a>
        <h1 class="title" id="title"></h1>
        <p class="sub" id="sub"></p>
        <div class="video" id="video"></div>
        <div class="desc" id="desc"></div>
      </div>
    </main>

    <script type="module">
      import { fetchProjects, fetchProjectBySlug } from "../js/sanity.js";

      const langBtn = document.getElementById("langBtn");
      const listView = document.getElementById("listView");
      const detailView = document.getElementById("detailView");

      let lang = localStorage.getItem("lang") || "es";
      langBtn.textContent = lang.toUpperCase();

      langBtn.addEventListener("click", () => {
        lang = lang === "es" ? "en" : "es";
        localStorage.setItem("lang", lang);
        langBtn.textContent = lang.toUpperCase();
        route();
      });

      function titleFor(p) { return lang === "es" ? p.title_es : p.title_en; }
      function descFor(p) { return lang === "es" ? p.description_es : p.description_en; }

      function vimeoId(url) {
        if (!url) return null;
        const m = String(url).match(/\b(\d{6,12})\b/);
        return m ? m[1] : null;
      }

      let projects = [];

      function renderList() {
        listView.innerHTML = projects.map(p => `
          <div class="card" data-slug="${p.slug}">
            <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy" />
            <div class="meta">
              <h3>${titleFor(p)}</h3>
              <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
            </div>
          </div>
        `).join("");

        listView.querySelectorAll(".card").forEach(card => {
          card.addEventListener("click", () => {
            const slug = card.getAttribute("data-slug");
            location.hash = `#/${slug}`;   // ✅ pro url without server routing
          });
        });
      }

      async function renderDetail(slug) {
        const project = await fetchProjectBySlug(slug);

        if (!project) {
          document.getElementById("title").textContent = "Project not found";
          document.getElementById("sub").textContent = "";
          document.getElementById("video").innerHTML = "";
          document.getElementById("desc").textContent = `No se encontró el proyecto con slug: ${slug}`;
          return;
        }

        document.title = `${titleFor(project)} – Projects`;

        document.getElementById("title").textContent = titleFor(project);
        document.getElementById("sub").textContent = [project.client, project.year].filter(Boolean).join(" • ");
        document.getElementById("desc").textContent = descFor(project) || "";

        const id = vimeoId(project.vimeo_url);
        document.getElementById("video").innerHTML = id
          ? `<iframe src="https://player.vimeo.com/video/${id}?autoplay=0&muted=0&title=0&byline=0&portrait=0"
                    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`
          : `<div style="padding:24px;opacity:.7">Vimeo URL inválida.</div>`;
      }

      function showList() {
        detailView.classList.add("hidden");
        listView.classList.remove("hidden");
      }

      function showDetail() {
        listView.classList.add("hidden");
        detailView.classList.remove("hidden");
      }

      async function route() {
        // hash example: #/parense-de-manos-2025
        const hash = location.hash || "";
        const m = hash.match(/^#\/(.+)$/);

        if (!m) {
          showList();
          renderList();
          document.title = "Projects";
          return;
        }

        const slug = m[1];
        showDetail();
        await renderDetail(slug);
      }

      window.addEventListener("hashchange", route);

      (async () => {
        projects = await fetchProjects();
        route();
      })();
    </script>
  </body>
</html>
