<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="index,follow" />

  <title>Calabria</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="canonical" href="https://www.bycalabria.com/" />

  <meta name="description" content="Productora audiovisual. Dirección, producción y post. Estética cinematográfica para marcas y artistas." />

  <!-- Open Graph / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calabria" />
  <meta property="og:description" content="Dirección, producción y post. Estética cinematográfica para marcas y artistas." />
  <meta property="og:image" content="https://www.bycalabria.com/assets/og.jpg" />
  <meta property="og:url" content="https://www.bycalabria.com/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.png" />

  <style>
    /* HOME specific */
    .hero-wrap{
      padding-top: 0;
      padding-bottom: 0;
    }

    .hero-card{
      position: relative;
      border: 0;
      border-radius: 0;
      overflow: hidden;
      background: #000;
    }

    /* FULLSCREEN REEL */
    .reel{
      position: relative;
      width: 100%;
      height: calc(100vh - 72px); /* nav height */
      min-height: 560px;
      background: #000;
      overflow: hidden;
    }

    .reel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
      background:#000;
    }

    /* subtle cinematic vignette (optional, nice) */
    .reel::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(1200px 600px at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,.25) 70%, rgba(0,0,0,.55) 100%);
      pointer-events:none;
    }

    /* Featured section spacing (so it starts after hero) */
    .section{
      padding-top: 44px;
      padding-bottom: 56px;
    }

    .sec-head{
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
    }

    .see-all{
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>

<body>
  <script type="module">
    import { mountNav } from "/js/nav.js";
    mountNav();
  </script>

  <main>
    <!-- HERO -->
    <section class="hero-wrap">
      <div class="hero-card">

        <!-- ✅ FULLSCREEN REEL VIDEO -->
        <div class="reel" id="reel">
          <video
            id="reelVideo"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
            poster="/assets/og.jpg"
          >
            <source src="/assets/reel.mp4" type="video/mp4" />
          </video>
        </div>

      </div>
    </section>

    <!-- FEATURED -->
    <section class="section container">
      <div class="sec-head">
        <h2 class="h2" id="featuredTitle">Destacados</h2>
        <a class="see-all" href="/projects/" id="seeAll">Ver todo →</a>
      </div>

      <div style="height: 14px"></div>

      <div class="grid" id="featuredGrid"></div>
    </section>
  </main>

  <script type="module">
    import { getLang } from "/js/site.js";
    import { fetchProjects } from "/js/sanity.js";

    const lang = getLang();

    const COPY = {
      es: {
        featured: "Destacados",
        seeAll: "Ver todo →",
      },
      en: {
        featured: "Featured",
        seeAll: "See all →",
      }
    };

    const c = COPY[lang];

    document.getElementById("featuredTitle").textContent = c.featured;
    document.getElementById("seeAll").textContent = c.seeAll;

    function titleFor(p){ return lang === "es" ? p.title_es : p.title_en; }

    const featuredGrid = document.getElementById("featuredGrid");

    (async () => {
      try{
        const projects = await fetchProjects();
        const featured = projects.filter(p => p.featured).slice(0, 6);

        featuredGrid.innerHTML = featured.map(p => `
          <a class="card" href="/projects/#/${encodeURIComponent(p.slug)}">
            <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy"/>
            <div class="meta">
              <h3>${titleFor(p)}</h3>
              <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
            </div>
          </a>
        `).join("");
      } catch(e){
        console.error(e);
        featuredGrid.innerHTML = `<div style="opacity:.7;padding:14px;">Error cargando destacados</div>`;
      }
    })();
  </script>
</body>
</html>
