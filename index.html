<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="index,follow" />
  <title>Calabria</title>

  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="canonical" href="https://www.bycalabria.com/" />

  <meta name="description" content="Productora audiovisual. Dirección, producción y post. Estética cinematográfica para marcas y artistas." />

  <!-- Open Graph / WhatsApp -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calabria" />
  <meta property="og:description" content="Dirección, producción y post. Estética cinematográfica para marcas y artistas." />
  <meta property="og:image" content="https://www.bycalabria.com/assets/og.jpg" />
  <meta property="og:url" content="https://www.bycalabria.com/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/favicon.png" />
</head>

<body class="home">
  <script type="module">
    import { mountNav } from "/js/nav.js";
    mountNav();
  </script>

  <!-- HERO FULLSCREEN -->
  <section class="hero">
    <div class="reel">
      <!-- 👇 el reel SIEMPRE se muestra full -->
      <video
        class="reel-video"
        src="/assets/reel.mp4"
        autoplay
        muted
        playsinline
        loop
        preload="auto"
      ></video>
    </div>
  </section>

  <!-- FEATURED -->
  <main class="container">
    <section class="section">
      <div class="sec-head">
        <h2 class="h2" id="featuredTitle">Destacados</h2>
        <a class="see-all" href="/projects/" id="seeAll">Ver todo →</a>
      </div>

      <div style="height: 14px"></div>
      <div class="grid" id="featuredGrid"></div>
    </section>

    <!-- BRANDS BLOCK -->
    <section class="brands">
      <div class="brands-inner">
        <h3 class="brands-title" id="brandsTitle">Marcas con las que trabajamos</h3>

        <div class="brands-grid">
          <!-- Reemplazá estos logos por los tuyos cuando los tengas -->
          <img src="/assets/brands/brand-01.png" alt="Brand 1" loading="lazy">
          <img src="/assets/brands/brand-02.png" alt="Brand 2" loading="lazy">
          <img src="/assets/brands/brand-03.png" alt="Brand 3" loading="lazy">
          <img src="/assets/brands/brand-04.png" alt="Brand 4" loading="lazy">
          <img src="/assets/brands/brand-05.png" alt="Brand 5" loading="lazy">
          <img src="/assets/brands/brand-06.png" alt="Brand 6" loading="lazy">
          <img src="/assets/brands/brand-07.png" alt="Brand 7" loading="lazy">
          <img src="/assets/brands/brand-08.png" alt="Brand 8" loading="lazy">
          <img src="/assets/brands/brand-09.png" alt="Brand 9" loading="lazy">
          <img src="/assets/brands/brand-10.png" alt="Brand 10" loading="lazy">
          <img src="/assets/brands/brand-11.png" alt="Brand 11" loading="lazy">
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import { getLang } from "/js/site.js";
    import { fetchProjects } from "/js/sanity.js";

    const lang = getLang();

    const COPY = {
      es: {
        featured: "Destacados",
        seeAll: "Ver todo →",
        brands: "Marcas con las que trabajamos"
      },
      en: {
        featured: "Featured",
        seeAll: "See all →",
        brands: "Brands we have teamed up with"
      }
    };

    const c = COPY[lang] || COPY.es;
    document.getElementById("featuredTitle").textContent = c.featured;
    document.getElementById("seeAll").textContent = c.seeAll;
    document.getElementById("brandsTitle").textContent = c.brands;

    function titleFor(p){ return lang === "es" ? p.title_es : p.title_en; }

    const featuredGrid = document.getElementById("featuredGrid");

    (async () => {
      const projects = await fetchProjects();
      const featured = projects
        .filter(p => p.featured)
        .sort((a,b) => (a.order ?? 999) - (b.order ?? 999));

      featuredGrid.innerHTML = featured.slice(0, 12).map(p => `
        <a class="card" href="/projects/#/${encodeURIComponent(p.slug)}">
          <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy"/>
          <div class="meta">
            <h3>${titleFor(p)}</h3>
            <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
          </div>
        </a>
      `).join("");
    })();
  </script>
</body>
</html>
