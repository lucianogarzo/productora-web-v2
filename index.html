<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calabria</title>

  <meta property="og:title" content="Calabria" />
  <meta property="og:description" content="Productora audiovisual." />
  <meta property="og:image" content="/assets/og.jpg" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="icon" href="/assets/favicon.png" />

  <!-- Global CSS -->
  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    /* Fullscreen reel */
    .hero-reel{
      position: relative;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .hero-reel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit: cover;
    }

    /* hide scroll gap if nav fixed adds padding */
    main{ padding-top: 0 !important; }
  </style>
</head>

<body>
  <script type="module">
    import { mountNav } from "/js/nav.js";
    mountNav();
  </script>

  <!-- FULLSCREEN REEL (NO TEXT OVERLAY) -->
  <section class="hero-reel">
    <video autoplay muted loop playsinline preload="auto">
      <source src="/assets/reel.mp4" type="video/mp4" />
    </video>
  </section>

  <!-- FEATURED PROJECTS (keeps your site useful even without scrolling) -->
  <main class="container" style="padding: 48px 0;">
    <section id="featured">
      <h2 style="margin:0 0 18px; letter-spacing:.08em; text-transform:uppercase; font-size:12px; opacity:.75;">
        Featured
      </h2>

      <div id="featuredGrid" class="grid"></div>
    </section>
  </main>

  <script type="module">
    import { fetchProjects } from "/js/sanity.js";
    import { getLang } from "/js/site.js";

    const lang = getLang();
    const grid = document.getElementById("featuredGrid");

    function titleFor(p){ return lang === "es" ? p.title_es : p.title_en; }

    (async () => {
      try {
        const projects = await fetchProjects();
        const featured = (projects || []).filter(p => p.featured).slice(0, 9);

        grid.innerHTML = featured.map(p => `
          <a class="card" href="/projects/#/${encodeURIComponent(p.slug)}">
            <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy" />
            <div class="meta">
              <h3 class="display">${titleFor(p)}</h3>
              <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
            </div>
          </a>
        `).join("");
      } catch(e) {
        console.error(e);
        grid.innerHTML = `<div style="padding:14px; opacity:.7;">No se pudo cargar contenido.</div>`;
      }
    })();
  </script>
</body>
</html>
