<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="index,follow" />

  <title>Calabria</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="canonical" href="https://www.bycalabria.com/" />

  <meta name="description" content="Productora audiovisual. Dirección, producción y post. Estética cinematográfica para marcas y artistas." />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Calabria" />
  <meta property="og:description" content="Dirección, producción y post. Estética cinematográfica para marcas y artistas." />
  <meta property="og:image" content="https://www.bycalabria.com/assets/og.jpg" />
  <meta property="og:url" content="https://www.bycalabria.com/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/favicon.png" />

  <style>
    /* HOME */
    .hero-wrap{ padding-top:0; padding-bottom: 22px; }
    .hero-card{ position:relative; border:0; border-radius:0; overflow:hidden; background:#000; }

    .reel{
      position:relative;
      width:100%;
      height:100vh;
      background:#000;
      overflow:hidden;
    }
    .reel video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      background:#000;
    }
    .reel::after{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0));
      pointer-events:none;
    }

    .sec-head{
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 18px;
    }
    .see-all{ color: rgba(10,10,10,.62); font-size: 14px; text-decoration:none; }

    /* ===== BRANDS (FULL WIDTH + stronger white logos) ===== */

    /* full width wrapper */
    .brands-band{
      width:100%;
      background:#151618;
      margin: 0;
      padding: 70px 0 62px;
      position:relative;
      overflow:hidden;
    }

    /* subtle highlight top */
    .brands-band::before{
      content:"";
      position:absolute;
      left:0; right:0;
      height: 190px;
      top:0;
      background: radial-gradient(1100px 260px at 50% 0%, rgba(255,255,255,.10), rgba(255,255,255,0));
      pointer-events:none;
    }

    /* inner content stays aligned with site grid */
    .brands-inner{
      position:relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 22px;
    }

    .brands-wrap{
      border-radius: 26px;
      padding: 0;
      background: transparent;
      color:#fff;
    }

    .brands-title{
      margin:0 0 34px;
      text-align:center;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: .2px;
      color: rgba(255,255,255,.92);
    }

    .brands-grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 30px 42px;
      align-items:center;
      justify-items:center;
      padding-top: 8px;
    }

    /* Each logo: same box */
    .brand-item{
      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      opacity: .86;
      transition: opacity .25s ease, transform .25s ease;
    }

    /* hover: stays white (NO COLOR SWITCH) */
    .brand-item:hover{
      opacity: 1;
      transform: translateY(-2px);
    }

    .brand-box{
      width: 190px;
      height: 68px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .brand-box img{
      width:100%;
      height:100%;
      object-fit: contain;
      display:block;

      /* better "white logo" treatment without losing details */
      filter:
        saturate(0)
        brightness(1.05)
        contrast(1.22)
        drop-shadow(0 2px 10px rgba(0,0,0,.35));
      opacity: .98;
    }

    @media (max-width: 900px){
      .brands-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .brand-box{ width: 175px; height: 62px; }
    }
    @media (max-width: 560px){
      .brands-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .brand-box{ width: 150px; height: 56px; }
    }
  </style>
</head>

<body class="home">
  <script type="module">
    import { mountNav } from "/js/nav.js";
    mountNav();
  </script>

  <!-- HERO -->
  <section class="hero-wrap">
    <div class="hero-card">
      <div class="reel">
        <video autoplay muted playsinline loop preload="auto">
          <source src="/assets/reel.mp4" type="video/mp4" />
        </video>
      </div>
    </div>
  </section>

  <main class="container">
    <!-- FEATURED -->
    <section class="section">
      <div class="sec-head">
        <h2 class="h2" id="featuredTitle">Destacados</h2>
        <a class="see-all" href="/projects/" id="seeAll">Ver todo →</a>
      </div>

      <div style="height: 14px"></div>

      <div id="featuredGrid" class="grid">
        <div style="opacity:.6;padding:14px;">Cargando…</div>
      </div>
    </section>
  </main>

  <!-- BRANDS FULL WIDTH BAND (outside container) -->
  <section class="brands-band" id="brandsSection" style="display:none;">
    <div class="brands-inner">
      <div class="brands-wrap">
        <h2 class="brands-title" id="brandsTitle">Marcas con las que trabajamos</h2>
        <div class="brands-grid" id="brandsGrid"></div>
      </div>
    </div>
  </section>

  <script type="module">
    import { getLang } from "/js/site.js";
    import { fetchProjects, fetchSiteSettings } from "/js/sanity.js";

    const lang = getLang();

    const COPY = {
      es: { featured: "Destacados", seeAll: "Ver todo →", brandsFallback: "Marcas con las que trabajamos" },
      en: { featured: "Featured", seeAll: "See all →", brandsFallback: "Brands we have teamed up with" }
    };
    const c = COPY[lang] || COPY.es;

    document.getElementById("featuredTitle").textContent = c.featured;
    document.getElementById("seeAll").textContent = c.seeAll;

    function titleFor(p){ return lang === "es" ? p.title_es : p.title_en; }
    const featuredGrid = document.getElementById("featuredGrid");

    // FEATURED
    (async () => {
      try{
        const projects = await fetchProjects();
        const featured = projects.filter(p => p.featured).slice(0, 12);

        if (!featured.length){
          featuredGrid.innerHTML = `<div style="opacity:.65;padding:14px;">No hay destacados todavía.</div>`;
          return;
        }

        featuredGrid.innerHTML = featured.map(p => `
          <a class="card" href="/projects/#/${encodeURIComponent(p.slug)}">
            <img src="${p.thumbnail || ""}" alt="${titleFor(p)}" loading="lazy"/>
            <div class="meta">
              <h3>${titleFor(p)}</h3>
              <p>${[p.client, p.year].filter(Boolean).join(" • ")}</p>
            </div>
          </a>
        `).join("");
      }catch(e){
        console.error("Featured error:", e);
        featuredGrid.innerHTML = `<div style="opacity:.65;padding:14px;">Error cargando destacados.</div>`;
      }
    })();

    // BRANDS (from Sanity)
    (async () => {
      try{
        const settings = await fetchSiteSettings();
        if (!settings) return;

        const brandsSection = document.getElementById("brandsSection");
        const brandsGrid = document.getElementById("brandsGrid");
        const brandsTitle = document.getElementById("brandsTitle");

        brandsTitle.textContent =
          lang === "es"
            ? (settings.brandsTitle_es || c.brandsFallback)
            : (settings.brandsTitle_en || c.brandsFallback);

        const brands = Array.isArray(settings.brands) ? settings.brands : [];
        const valid = brands.filter(b => b && b.logo);

        if (!valid.length) return;

        brandsSection.style.display = "block";

        brandsGrid.innerHTML = valid.map(b => {
          const inner = `
            <div class="brand-box">
              <img src="${b.logo}" alt="${b.name || "Brand"}" loading="lazy"/>
            </div>
          `;
          if (b.url) {
            return `<a class="brand-item" href="${b.url}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
          }
          return `<div class="brand-item">${inner}</div>`;
        }).join("");

      }catch(e){
        console.warn("Brands error:", e);
      }
    })();
  </script>
</body>
</html>
